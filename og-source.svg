<text x="208" y="134" font-family="Poppins" font-size="19" font-weight="600" fill="#141019" letter-spacing="1.6">KEEP AUSTIN COLORFUL</text>
<text x="96" y="272" font-family="Poppins" font-size="58" font-weight="600" fill="#141019" letter-spacing="-1.4">Let's put the Pride</text>
<rect x="92" y="316" width="430" height="26" rx="3" fill="#FFE27A"/>
<text x="96" y="340" font-family="Poppins" font-size="58" font-weight="600" fill="#141019" letter-spacing="-1.4">colors back on 4th St.</text>
<text x="96" y="414" font-family="Lato" font-size="21" fill="#3A3540">San Antonio faced the same order and painted its</text>
<text x="96" y="444" font-family="Lato" font-size="21" fill="#3A3540">sidewalks instead: two blocks of Pride color, entirely</text>
<text x="96" y="474" font-family="Lato" font-size="21" fill="#3A3540">legal, no council vote needed. Austin can do this too.</text>
<text x="96" y="532" font-family="Poppins" font-size="17" font-weight="600" fill="#6A2578" letter-spacing="1.2">4TH &amp; COLORADO  ·  AUSTIN, DISTRICT 9</text>
</svg>